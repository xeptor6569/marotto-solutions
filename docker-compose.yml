services:
  web:
    build: .
    container_name: marotto-solutions
    restart: always
    ports:
      - "${APP_PORT:-3081}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marotto:marotto_password@postgres:5432/marotto_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3081}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - EMAIL_SERVER=${EMAIL_SERVER}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - ./public:/app/public
      - marotto_data:/app/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: marotto-postgres
    restart: always
    environment:
      - POSTGRES_USER=marotto
      - POSTGRES_PASSWORD=marotto_password
      - POSTGRES_DB=marotto_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  marotto_data:
  postgres_data:
