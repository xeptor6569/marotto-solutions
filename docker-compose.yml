services:
  web:
    build: .
    container_name: marotto-solutions
    restart: always
    ports:
      - "${APP_PORT:-3081}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marotto:marotto_password@postgres:5432/marotto_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:${APP_PORT:-3081}}
      - AUTH_URL=${NEXTAUTH_URL:-http://localhost:${APP_PORT:-3081}}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - EMAIL_SERVER=${EMAIL_SERVER}
      - EMAIL_FROM=${EMAIL_FROM}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./public:/app/public
      - marotto_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: marotto-postgres
    restart: always
    environment:
      - POSTGRES_USER=marotto
      - POSTGRES_PASSWORD=marotto_password
      - POSTGRES_DB=marotto_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marotto -d marotto_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Lightweight cron sidecar that pings the contract scheduler endpoint daily.
  # Disable by setting CONTRACTS_CRON_PROFILE=disabled (or remove this service)
  # if you'd rather drive the scheduler from an external cron service.
  cron:
    image: alpine:3.20
    container_name: marotto-cron
    restart: always
    depends_on:
      - web
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - CONTRACTS_CRON_SCHEDULE=${CONTRACTS_CRON_SCHEDULE:-15 8 * * *}
      - CALENDAR_CRON_SCHEDULE=${CALENDAR_CRON_SCHEDULE:-0 * * * *}
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null &&
             printf '%s curl -fsS -X POST -H \"X-Cron-Secret: %s\" http://web:3000/api/cron/contracts >> /var/log/contracts-cron.log 2>&1\n' \"$$CONTRACTS_CRON_SCHEDULE\" \"$$CRON_SECRET\" > /etc/crontabs/root &&
             printf '%s curl -fsS -X POST -H \"X-Cron-Secret: %s\" http://web:3000/api/cron/calendar >> /var/log/calendar-cron.log 2>&1\n' \"$$CALENDAR_CRON_SCHEDULE\" \"$$CRON_SECRET\" >> /etc/crontabs/root &&
             touch /var/log/contracts-cron.log /var/log/calendar-cron.log &&
             crond -f -l 8 -L /var/log/contracts-cron.log"

volumes:
  marotto_data:
  postgres_data:
