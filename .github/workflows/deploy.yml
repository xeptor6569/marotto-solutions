name: Deploy to Self-Hosted

on:
  push:
    branches:
      - main

concurrency:
  # One deploy at a time on the single self-hosted runner. Do not cancel an
  # in-flight deploy (docker build / migrate mid-flight) when a newer push lands.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate required configuration
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          missing=0
          for name in APP_PORT NEXTAUTH_SECRET EMAIL_SERVER EMAIL_FROM; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ -z "${NEXTAUTH_URL}" ]; then
            echo "::error::Missing required environment variable NEXTAUTH_URL (GitHub prod → Variables)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create .env file
        run: |
          # Overwrite (do not append) so self-hosted runner workspaces do not
          # accumulate duplicate keys across deploys.
          {
            echo "APP_PORT=${{ secrets.APP_PORT }}"
            echo "NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}"
            # Auth.js v5 prefers AUTH_URL / AUTH_SECRET / AUTH_TRUST_HOST in production.
            echo "AUTH_URL=${{ vars.NEXTAUTH_URL }}"
            echo "AUTH_TRUST_HOST=true"
            if [ -n "${{ secrets.NEXTAUTH_SECRET }}" ]; then
              echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
              echo "AUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
            fi
            if [ -n "${{ secrets.EMAIL_SERVER }}" ]; then
              echo "EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}"
            fi
            if [ -n "${{ secrets.EMAIL_FROM }}" ]; then
              echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}"
            fi
            if [ -n "${{ vars.NEXT_TELEMETRY_DISABLED }}" ]; then
              echo "NEXT_TELEMETRY_DISABLED=${{ vars.NEXT_TELEMETRY_DISABLED }}"
            fi
            # Optional: use repo secret DATABASE_URL for managed Postgres (RDS, etc.).
            # If unset, docker-compose.yml defaults to the bundled postgres service.
            if [ -n "${{ secrets.DATABASE_URL }}" ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            fi
          } > .env

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U marotto -d marotto_db >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "::error::Postgres failed to become ready"
          exit 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "node $(node -v), npm $(npm -v)"
          # package.json engines require npm >=10; the runner image has shipped
          # with npm 9.x and npm ci has SIGSEGV'd there (exit 139).
          major="$(npm -v | cut -d. -f1)"
          if [ "$major" -lt 10 ]; then
            echo "Upgrading npm to satisfy engines (>=10)…"
            npm install -g npm@10
            echo "npm $(npm -v)"
          fi
          # Same class of runner SIGSEGV as prisma migrate — retry before failing.
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "::warning::'npm ci' failed on attempt ${attempt}/3"
            echo "node $(node -v), npm $(npm -v)"
            free -m || true
            rm -rf node_modules
            sleep 5
          done
          echo "::error::'npm ci' failed 3 times"
          exit 1

      - name: Run tests
        run: npm test

      # Apply all pending migrations from prisma/migrations/ on the runner
      # (npm ci + host Postgres port), not inside the web image — the standalone
      # container has no Prisma CLI. New tables/columns (e.g. JobTimeLog) ship
      # automatically on merge to main; no manual migrate on prod.
      - name: Run Prisma migrations
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL_SECRET}" ]; then
            export DATABASE_URL="${DATABASE_URL_SECRET}"
          else
            # Bundled compose Postgres is published on host port 5433.
            export DATABASE_URL="postgresql://marotto:marotto_password@127.0.0.1:5433/marotto_db"
          fi
          # Call the binary npm ci just installed instead of going through npx,
          # so the step cannot be affected by npx package resolution.
          prisma="./node_modules/.bin/prisma"
          if [ ! -x "$prisma" ]; then
            echo "::error::Prisma CLI not found at $prisma — did 'npm ci' run?"
            exit 1
          fi
          echo "Migrating database…"
          # 20260509180000_init is a no-op placeholder; its original DDL now lives in
          # 20260101000000_init_auth_and_client. Restructuring the history left a failed
          # duplicate row for that name in _prisma_migrations, and a failed row makes
          # migrate deploy refuse to apply anything else (P3009). Delete the row, but only
          # when the same migration is also recorded as applied, so a database where it
          # genuinely has not run yet is left alone for migrate deploy to handle.
          "$prisma" db execute --url "$DATABASE_URL" --stdin <<'SQL'
          DO $do$
          BEGIN
            IF to_regclass('_prisma_migrations') IS NULL THEN
              RETURN;
            END IF;
            DELETE FROM "_prisma_migrations" dup
            WHERE dup.migration_name = '20260509180000_init'
              AND dup.finished_at IS NULL
              AND EXISTS (
                SELECT 1
                FROM "_prisma_migrations" applied
                WHERE applied.migration_name = dup.migration_name
                  AND applied.finished_at IS NOT NULL
              );
          END
          $do$;
          SQL
          # The CLI has died with SIGSEGV on this runner before it even opened a
          # connection, which aborts an otherwise healthy deploy. Retry before failing.
          for attempt in 1 2 3; do
            if "$prisma" migrate deploy; then
              echo "Prisma migrations applied (including any newly added migrations in this deploy)."
              exit 0
            fi
            echo "::warning::'prisma migrate deploy' failed on attempt ${attempt}/3"
            echo "node $(node -v), prisma $("$prisma" -v 2>/dev/null | head -n 1 || echo unknown)"
            free -m || true
            df -h . || true
            sleep 5
          done
          echo "::error::'prisma migrate deploy' failed 3 times; leaving the running deployment untouched"
          exit 1

      - name: Build and start application
        run: docker compose up -d --build --remove-orphans

      - name: Verify application is healthy
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          set -euo pipefail
          echo "Waiting for application on port ${APP_PORT}…"
          for i in $(seq 1 36); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' marotto-solutions 2>/dev/null || echo missing)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${APP_PORT}/" || true)"
            echo "Attempt $i/36: container=$status http=$code"
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then
              echo "Application is healthy"
              exit 0
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ] || [ "$status" = "missing" ]; then
              echo "::error::Container is $status"
              docker logs --tail 100 marotto-solutions || true
              exit 1
            fi
            sleep 2
          done
          echo "::error::Application failed health check"
          docker ps -a --filter name=marotto-solutions || true
          docker logs --tail 200 marotto-solutions || true
          exit 1

      - name: Prune unused images
        run: docker image prune -f
