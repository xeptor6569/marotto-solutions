name: Deploy to Self-Hosted

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate required configuration
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          missing=0
          for name in APP_PORT NEXTAUTH_SECRET EMAIL_SERVER EMAIL_FROM; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ -z "${NEXTAUTH_URL}" ]; then
            echo "::error::Missing required environment variable NEXTAUTH_URL (GitHub prod → Variables)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create .env file
        run: |
          echo "APP_PORT=${{ secrets.APP_PORT }}" >> .env
          echo "NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}" >> .env
          if [ -n "${{ secrets.NEXTAUTH_SECRET }}" ]; then
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env
          fi
          if [ -n "${{ secrets.EMAIL_SERVER }}" ]; then
            echo "EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}" >> .env
          fi
          if [ -n "${{ secrets.EMAIL_FROM }}" ]; then
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
          fi
          if [ -n "${{ vars.NEXT_TELEMETRY_DISABLED }}" ]; then
            echo "NEXT_TELEMETRY_DISABLED=${{ vars.NEXT_TELEMETRY_DISABLED }}" >> .env
          fi
          # Optional: use repo secret DATABASE_URL for managed Postgres (RDS, etc.).
          # If unset, docker-compose.yml defaults to the bundled postgres service.
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          fi

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U marotto -d marotto_db >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "::error::Postgres failed to become ready"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and start application
        run: docker compose up -d --build --remove-orphans

      # Applies every pending migration in prisma/migrations/ (e.g. client isProspect).
      # Clear a failed duplicate "init" migration if a previous deploy left the DB in P3018 state.
      - name: Resolve failed duplicate migration (idempotent)
        continue-on-error: true
        run: |
          docker compose exec -T web npx prisma@6.19.1 migrate resolve --rolled-back 20260509180000_init --schema=/app/prisma/schema.prisma

      - name: Run Prisma migrations
        run: docker compose exec -T web npx prisma@6.19.1 migrate deploy --schema=/app/prisma/schema.prisma

      - name: Prune unused images
        run: docker image prune -f
